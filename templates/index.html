<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MiniChat</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0f1115;
    color: #e6e8ee;
    font-family: -apple-system, 'Segoe UI', Tahoma, 'Noto Naskh Arabic', sans-serif;
    font-size: 15px;
    overflow: hidden;
  }
  .app {
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
    max-width: 760px; margin: 0 auto;
    background: #0f1115;
    border-left: 1px solid #1c1f26;
    border-right: 1px solid #1c1f26;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px;
    background: #14171d;
    border-bottom: 1px solid #1c1f26;
    flex-shrink: 0;
  }
  header h1 {
    font-size: 16px; font-weight: 600; margin: 0;
    color: #e6e8ee; letter-spacing: 0.3px;
  }
  header h1 span { color: #6b7a99; font-weight: 400; font-size: 13px; margin-right: 6px; }
  .hstats {
    font-size: 11.5px; color: #8a93a6;
    background: #1a1d24; padding: 4px 10px; border-radius: 6px;
    border: 1px solid #23262e;
  }
  .toolbar {
    display: flex; gap: 6px; padding: 8px 16px;
    background: #0f1115;
    border-bottom: 1px solid #1c1f26;
    flex-shrink: 0; overflow-x: auto;
  }
  .toolbar button {
    background: #1a1d24; color: #b8bfcc;
    border: 1px solid #23262e; border-radius: 6px;
    padding: 6px 12px; font-size: 12.5px; cursor: pointer;
    font-family: inherit; white-space: nowrap;
    transition: background 0.15s, color 0.15s;
  }
  .toolbar button:hover { background: #23262e; color: #e6e8ee; }
  .messages {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    padding: 16px;
    scroll-behavior: smooth;
  }
  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-thumb { background: #2a2e37; border-radius: 3px; }
  .messages::-webkit-scrollbar-track { background: transparent; }

  .msg {
    display: block;
    margin-bottom: 14px;
    width: 100%;
    clear: both;
  }
  .msg::after { content: ""; display: table; clear: both; }
  .bubble {
    display: inline-block;
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.65;
    font-size: 14.5px;
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow-wrap: anywhere;
    word-break: break-word;
    text-align: right;
    vertical-align: top;
  }
  .msg.user .bubble {
    background: #2a3550;
    color: #e6e8ee;
    float: left;
    border-bottom-left-radius: 3px;
    text-align: right;
  }
  .msg.bot .bubble {
    background: #1a1d24;
    color: #d8dde6;
    border: 1px solid #23262e;
    float: right;
    border-bottom-right-radius: 3px;
    text-align: right;
  }
  .msg.bot .bubble.table {
    font-family: 'Courier New', 'Consolas', monospace;
    font-size: 12.5px;
    direction: ltr;
    text-align: left;
    unicode-bidi: embed;
    white-space: pre;
    overflow-x: auto;
    max-width: 100%;
  }

  .input-area {
    display: flex; gap: 8px; padding: 12px 16px;
    background: #14171d;
    border-top: 1px solid #1c1f26;
    flex-shrink: 0;
  }
  .input-area input {
    flex: 1;
    background: #0f1115; color: #e6e8ee;
    border: 1px solid #23262e; border-radius: 8px;
    padding: 10px 14px; font-size: 14.5px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }
  .input-area input:focus { border-color: #3b4d75; }
  .input-area button {
    background: #3b4d75; color: #e6e8ee;
    border: none; border-radius: 8px;
    padding: 10px 18px; font-size: 14px;
    font-family: inherit; cursor: pointer;
    font-weight: 600;
    transition: background 0.15s;
  }
  .input-area button:hover { background: #4a6094; }
  .input-area button:disabled { background: #23262e; color: #6b7a99; cursor: not-allowed; }

  .panel {
    position: fixed; top: 0; right: 0; bottom: 0; left: 0;
    background: rgba(0,0,0,0.7); z-index: 100;
    display: none; align-items: center; justify-content: center;
    padding: 20px;
  }
  .panel.open { display: flex; }
  .panel-body {
    background: #14171d; border: 1px solid #23262e;
    border-radius: 12px; max-width: 640px; width: 100%;
    max-height: 80vh; overflow-y: auto;
    padding: 20px;
  }
  .panel-body h2 {
    margin: 0 0 14px 0; font-size: 16px;
    color: #e6e8ee; font-weight: 600;
    border-bottom: 1px solid #23262e; padding-bottom: 10px;
  }
  .panel-body pre {
    font-family: 'Courier New', monospace; font-size: 12.5px;
    color: #b8bfcc; white-space: pre-wrap; word-wrap: break-word;
    margin: 0; line-height: 1.5;
    direction: rtl; text-align: right;
    unicode-bidi: plaintext;
  }
  .panel-close {
    background: transparent; color: #8a93a6;
    border: 1px solid #23262e; border-radius: 6px;
    padding: 6px 14px; margin-top: 14px;
    cursor: pointer; font-family: inherit;
    font-size: 13px;
  }
  .panel-close:hover { color: #e6e8ee; }
  .memory-list {
    direction: rtl; text-align: right;
    font-size: 13.5px; line-height: 1.8;
  }
  .memory-list .item {
    padding: 8px 10px; border-bottom: 1px solid #1c1f26;
    display: flex; justify-content: space-between; gap: 10px;
  }
  .memory-list .item:last-child { border-bottom: none; }
  .memory-list .q { color: #b8bfcc; }
  .memory-list .a { color: #6b7a99; font-size: 12px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>MiniChat <span>v2.3</span></h1>
    <div class="hstats" id="hstats">—</div>
  </header>

  <div class="toolbar">
    <button data-cmd="~مساعدة">مساعدة</button>
    <button data-cmd="~ذاكرة">الذاكرة</button>
    <button data-cmd="~إحصاء">إحصاءات</button>
    <button data-cmd="~تدريب">تدريب</button>
    <button onclick="openPanel('stats')">لوحة</button>
    <button onclick="clearChat()">مسح العرض</button>
  </div>

  <div class="messages" id="messages"></div>

  <div class="input-area">
    <input id="input" type="text" placeholder="اكتب رسالتك..." autocomplete="off">
    <button id="send">إرسال</button>
  </div>
</div>

<div class="panel" id="panel">
  <div class="panel-body">
    <h2 id="panel-title">لوحة</h2>
    <div id="panel-content"></div>
    <button class="panel-close" onclick="closePanel()">إغلاق</button>
  </div>
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const hstatsEl = document.getElementById('hstats');
const panelEl = document.getElementById('panel');
const panelTitleEl = document.getElementById('panel-title');
const panelContentEl = document.getElementById('panel-content');

function addMsg(who, text) {
  const msg = document.createElement('div');
  msg.className = 'msg ' + who;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (who === 'bot' && (text.includes('━') || text.includes('╔') || text.includes('╠') || text.includes('┃'))) {
    bubble.classList.add('table');
  }
  bubble.textContent = text;
  msg.appendChild(bubble);
  messagesEl.appendChild(msg);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return bubble;
}

async function send() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = '';
  addMsg('user', text);
  sendBtn.disabled = true;
  const thinking = addMsg('bot', '...');
  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    const data = await r.json();
    thinking.textContent = data.reply || '(لا رد)';
    if (thinking.textContent.includes('━') || thinking.textContent.includes('╔')) {
      thinking.classList.add('table');
    }
    refreshStats();
  } catch (e) {
    thinking.textContent = 'خطأ في الاتصال: ' + e;
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

async function refreshStats() {
  try {
    const r = await fetch('/api/stats');
    const s = await r.json();
    const parts = [];
    if (s.memory_pairs !== undefined) parts.push('ذاكرة ' + s.memory_pairs);
    if (s.turns !== undefined) parts.push('رسائل ' + s.turns);
    else if (s.total_turns !== undefined) parts.push('رسائل ' + s.total_turns);
    hstatsEl.textContent = parts.length ? parts.join(' | ') : '—';
  } catch (e) {}
}

async function openPanel(type) {
  panelEl.classList.add('open');
  panelContentEl.innerHTML = '<pre>جاري التحميل...</pre>';
  if (type === 'stats') {
    panelTitleEl.textContent = 'الإحصاءات';
    try {
      const r = await fetch('/api/stats');
      const s = await r.json();
      panelContentEl.innerHTML = '<pre>' + JSON.stringify(s, null, 2) + '</pre>';
    } catch (e) {
      panelContentEl.innerHTML = '<pre>خطأ: ' + e + '</pre>';
    }
  } else if (type === 'memory') {
    panelTitleEl.textContent = 'الذاكرة';
    try {
      const r = await fetch('/api/memory/list');
      const s = await r.json();
      let html = '<div class="memory-list">';
      html += '<div style="margin-bottom:10px;color:#8a93a6;font-size:12px;">عدد الأزواج: ' + (s.count || 0) + '</div>';
      if (s.pairs && s.pairs.length) {
        for (const p of s.pairs.slice(0, 100)) {
          html += '<div class="item"><span class="q">' + escapeHtml(p.q) + '</span><span class="a">' + escapeHtml(p.a) + '</span></div>';
        }
      } else {
        html += '<div style="color:#6b7a99;">لا يوجد محتوى.</div>';
      }
      html += '</div>';
      panelContentEl.innerHTML = html;
    } catch (e) {
      panelContentEl.innerHTML = '<pre>خطأ: ' + e + '</pre>';
    }
  }
}
function closePanel() { panelEl.classList.remove('open'); }
function clearChat() { messagesEl.innerHTML = ''; }
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

sendBtn.addEventListener('click', send);
inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

document.querySelectorAll('.toolbar button[data-cmd]').forEach(b => {
  b.addEventListener('click', () => {
    inputEl.value = b.dataset.cmd;
    send();
  });
});

addMsg('bot', 'MiniChat جاهز. اكتب سؤالك.');
refreshStats();
inputEl.focus();
</script>
</body>
</html>
