name: MiniChat CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minichat-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        python-version:
          - "3.14"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Compile all Python files
        run: |
          python -m compileall -q .

      - name: Run hardening suite
        run: |
          python tests/hardening_suite.py

      - name: Run variable reasoning hardening
        run: |
          python tests/test_variable_reasoning.py
